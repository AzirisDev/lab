# Deployment with initContainers

apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
  namespace: linkding-2
spec:
  replicas: 1
  selector:
    matchLabels: { app: linkding }
  template:
    metadata:
      labels: { app: linkding }
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432; do
                echo "waiting for postgres..."; sleep 2
              done
      containers:
        - name: linkding
          image: sissbruecker/linkding:latest
          ports:
            - containerPort: 9090
          env:
            - name: LD_DB_ENGINE
              value: postgres
            - name: LD_DB_HOST
              value: postgres
            - name: LD_DB_PORT
              value: "5432"
            - name: LD_DB_DATABASE
              valueFrom: { secretKeyRef: { name: linkding-db, key: database } }
            - name: LD_DB_USER
              valueFrom: { secretKeyRef: { name: linkding-db, key: username } }
            - name: LD_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: linkding-db, key: password } }
          readinessProbe:
            httpGet: { path: /health, port: 9090 }
            initialDelaySeconds: 15

---

# LoadBalancer

apiVersion: v1
kind: Service
metadata:
  name: linkding
  namespace: linkding-2
spec:
  type: LoadBalancer
  selector: { app: linkding }
  ports:
    - port: 9090
      targetPort: 9090
