apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
  namespace: linkding
spec:
  replicas: 1
  selector:
    matchLabels: { app: linkding }
  template:
    metadata:
      labels: { app: linkding }
    spec:
      containers:
        - name: linkding
          image: sissbruecker/linkding:latest
          ports:
            - containerPort: 9090
          envFrom:
            - secretRef: { name: linkding-admin }
          volumeMounts:
            - name: data
              mountPath: /etc/linkding/data
          readinessProbe:
            httpGet: { path: /health, port: 9090 }
            initialDelaySeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: linkding-data
